name: listen_plus
description: "Listen+ native Android and iOS client"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.1.25
  cupertino_icons: ^1.0.8
  file_picker: ^8.3.7
  firebase_auth: ^5.6.0
  firebase_core: ^3.15.0
  http: ^1.5.0
  just_audio: ^0.9.46
  path_provider: ^2.1.5
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  archive: ^4.6.0
  pdfx: ^2.11.0
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_foundation 2.6+ pulls objective_c native hooks that fail under
# the current Flutter/Xcode toolchain in this environment.
dependency_overrides:
  path_provider_foundation: 2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/sample_narration.wav
    - assets/samples/sample_title.epub.txt
    - assets/samples/sample_episode.wav
