# Build & deploy Listen+ API to Cloud Run (same GCP project as Firebase).
# Usage (from apps/api):
#   gcloud builds submit --config cloudbuild.yaml
substitutions:
  _SERVICE: listen-api
  _REGION: us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/listen/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/listen/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/listen/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=DATA_BACKEND=firestore,MEDIA_BACKEND=firebase,AUTH_MODE=hybrid,FIREBASE_PROJECT_ID=$PROJECT_ID,FIREBASE_STORAGE_BUCKET=$PROJECT_ID.firebasestorage.app,FIRESTORE_PREFIX=listen,PAYMENTS_MODE=simulate,ALLOW_CLIENT_GRANTS=true

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/listen/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
